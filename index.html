<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Reiseplaner" />
  <meta name="theme-color" content="#ffffff" />
  <title>Reiseplaner</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a1b1f'/><text x='50' y='67' font-size='54' text-anchor='middle'>✈️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Charcoal Editorial Header -->
    <header id="appHeader" class="app-header">
      <div id="headerTopBar" class="header-top hidden">
        <button id="headerLeftBtn" class="header-icon-btn" type="button" aria-label="Zurück">
          <svg id="backIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="header-right"></div>
      </div>

      <div class="header-titles">
        <button id="tripTitleEditBtn" class="trip-title-btn" type="button" aria-label="Reise bearbeiten">
          <h1 id="tripTitleText" class="trip-title">Mallorca 2026</h1>
          <span class="title-edit-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </span>
        </button>
        <p id="tripSubtitleText" class="trip-subtitle">5 Tage</p>
      </div>
    </header>

    <!-- Curved Pure White Sheet -->
    <div class="content-sheet">
      <!-- Day Tabs (Preview Mode) -->
      <nav id="dayPills" class="day-pills" aria-label="Reisetage"></nav>

      <!-- Formatting Toolbar (Edit Mode) -->
      <div id="mdToolbar" class="md-toolbar hidden" role="toolbar" aria-label="Formatierung">
        <button type="button" class="md-tool-btn" data-format="h1">H1</button>
        <button type="button" class="md-tool-btn" data-format="h2">H2</button>
        <button type="button" class="md-tool-btn" data-format="bold">Fett</button>
        <button type="button" class="md-tool-btn" data-format="todo">Todo</button>
        <button type="button" class="md-tool-btn" data-format="ul">Liste</button>
        <button type="button" class="md-tool-btn" id="toolbarTicketBtn">+ Ticket</button>
        <button type="button" class="md-tool-btn" id="insertTemplateBtn">Vorlage</button>
      </div>

      <!-- Horizontal Swipeable Days -->
      <main id="daysTrack" class="days-track" aria-live="polite"></main>

      <!-- Bottom Navigation Bar -->
      <footer id="bottomBar" class="bottom-bar">
        <button id="prevDayBtn" class="circle-nav-btn secondary" type="button" aria-label="Vorheriger Tag">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

        <button id="nextCtaBtn" class="cta-pill-btn" type="button">
          Bearbeiten
        </button>

        <button id="nextDayBtn" class="circle-nav-btn" type="button" aria-label="Nächster Tag">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </footer>
    </div>
  </div>

  <!-- Ticket Add/Edit Modal -->
  <div id="ticketModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ticketModalTitle">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="ticketModalTitle">Ticket hinzufügen</h2>
        <button id="closeTicketModalBtn" class="soft-pill-btn" type="button">Abbrechen</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label>Kategorie</label>
          <div id="ticketTypeChips" class="type-chips">
            <button type="button" class="type-chip active" data-type="flight">✈️ Flug</button>
            <button type="button" class="type-chip" data-type="hotel">🏨 Hotel</button>
            <button type="button" class="type-chip" data-type="car">🚗 Mietwagen</button>
            <button type="button" class="type-chip" data-type="ticket">🎫 Ticket</button>
          </div>
        </div>

        <div class="form-group">
          <label for="inputTicketTitle">Titel</label>
          <input id="inputTicketTitle" type="text" placeholder="z.B. Flug LH 1824 oder Hotel Palma" autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="inputTicketMeta">Zeit / Buchungscode / Info</label>
          <input id="inputTicketMeta" type="text" placeholder="z.B. 10:15 → 12:30 · Code: XY89K" autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="inputTicketUrl">Link zum Ticket / PDF (optional)</label>
          <input id="inputTicketUrl" type="url" placeholder="https://..." autocomplete="off" />
        </div>

        <div class="modal-footer-actions">
          <button id="deleteTicketBtn" type="button" class="danger-pill-btn hidden">Löschen</button>
          <button id="saveTicketBtn" type="button" class="accent-pill-btn full-width">Ticket speichern</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings / Trip Setup Modal -->
  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="modalTitle">Reise einrichten</h2>
        <button id="closeModalBtn" class="accent-pill-btn" type="button">Fertig</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="inputTripName">Reiseziel / Titel</label>
          <input id="inputTripName" type="text" placeholder="z.B. Mallorca 2026" autocomplete="off" />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label>Zeitraum (optional)</label>
            <button type="button" id="clearDatesBtn" class="text-link-btn hidden">Datum entfernen</button>
          </div>
          <div class="form-row">
            <div class="form-group compact">
              <label for="inputStartDate" class="sub-label">Von</label>
              <div class="date-picker-pill" id="startDatePill">
                <span id="startDateDisplay" class="date-display placeholder">Start wählen</span>
                <input id="inputStartDate" type="date" aria-label="Startdatum" />
              </div>
            </div>
            <div class="form-group compact">
              <label for="inputEndDate" class="sub-label">Bis</label>
              <div class="date-picker-pill" id="endDatePill">
                <span id="endDateDisplay" class="date-display placeholder">Ende wählen</span>
                <input id="inputEndDate" type="date" aria-label="Enddatum" />
              </div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="inputDaysCount">Anzahl Tage</label>
          <div class="stepper">
            <button type="button" id="decDaysBtn" class="stepper-btn">−</button>
            <input id="inputDaysCount" type="number" min="1" max="60" inputmode="numeric" />
            <button type="button" id="incDaysBtn" class="stepper-btn">+</button>
          </div>
        </div>

        <div class="modal-section-label">Daten & Backup</div>
        <div class="action-list">
          <button id="exportMdBtn" type="button" class="action-row">
            <span>Als Markdown kopieren</span>
            <span class="action-hint">Kopieren</span>
          </button>
          <button id="resetTripBtn" type="button" class="action-row danger">
            <span>Alle Tage zurücksetzen</span>
            <span class="action-hint">Reset</span>
          </button>
        </div>

        <p class="modal-tip">
          Tipp: Im iPhone Safari auf <strong>Teilen → Zum Home-Bildschirm</strong> tippen, um den Reiseplaner wie eine echte App zu nutzen.
        </p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
